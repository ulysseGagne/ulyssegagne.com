<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>A video, by its link</title>
<style>
:root{--bg:#141312;--fg:#ece8e0;--mute:#a39e94;--line:#3a3833;--box:#22201d;--accent:#e0a27a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{width:min(1280px,96vw);margin:0 auto;padding:3vh 0 4vh}
#stage{display:flex;flex-direction:column;width:100%;background:#000}
#stage:fullscreen{width:100vw;height:100vh}
#box{position:relative;width:100%;aspect-ratio:16/9;max-height:80vh;overflow:hidden;background:#000}
#stage:fullscreen #box{flex:1;max-height:none;aspect-ratio:auto}
#player{position:absolute;top:0;left:0;width:100%;height:100%;border:0;pointer-events:none}
#hit{position:absolute;inset:0;z-index:5;cursor:pointer}
#end{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:#161513;text-align:center;cursor:pointer}
#end.on{display:flex}
#bar{display:flex;align-items:center;gap:.7em;padding:.45em .7em;background:#1b1a18;flex-wrap:wrap}
#bar button{font:inherit;font-size:.95em;padding:.25em .7em;border-radius:7px;border:1px solid var(--line);background:var(--box);color:var(--fg);cursor:pointer;min-width:2.6em}
#seek{flex:1;min-width:8em;height:10px;border-radius:5px;background:var(--line);overflow:hidden;cursor:pointer}
#fill{height:100%;width:0;background:var(--accent);pointer-events:none}
#time{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--mute)}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;margin:.9em 0}
input{flex:1;min-width:14em;font:inherit;padding:.4em .6em;border:1px solid var(--line);border-radius:8px;background:var(--box);color:var(--fg)}
.row button{font:inherit;padding:.4em 1em;border-radius:8px;border:1px solid var(--line);background:var(--box);color:var(--fg);cursor:pointer}
h1{font-weight:650}
</style>
</head>
<body>
<main>
<div id="video" hidden>
  <div id="stage">
    <div id="box">
      <iframe id="player" title="The video" tabindex="-1" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div id="hit" title="Play or pause"></div>
      <div id="end"><div style="font-size:1.4em;font-weight:650">The end</div><div class="mute">Click to watch it again, or paste another link below.</div></div>
    </div>
    <div id="bar">
      <button id="pp" type="button">▶</button>
      <div id="seek"><div id="fill"></div></div>
      <span id="time"></span>
      <button id="spd" type="button">1×</button>
      <button id="snd" type="button">Sound on</button>
      <button id="cp" type="button">Copy link</button>
      <button id="fs" type="button">Full screen</button>
    </div>
  </div>
  <p class="mute">Space plays or pauses, the arrows move 5 seconds, F is full screen, M mutes.</p>
</div>
<h1 id="head">A video, by its link</h1>
<form id="f" class="row"><input id="link" placeholder="Paste a YouTube link" autocomplete="off"><button>Watch</button></form>
<p id="note" class="mute"></p>
</main>
<script>
// One video, by its link, with nothing around it: YouTube's own player, without its controls and out of
// the mouse's reach, so none of its menus or rows can open; this page has its own controls, and covers
// the picture once the video is over, where YouTube shows other videos.
var LINK = /(?:youtube(?:-nocookie)?\.com\/(?:shorts\/|live\/|embed\/|watch\?(?:.*&)?v=)|youtu\.be\/)([A-Za-z0-9_-]{11})/;
function $(i){ return document.getElementById(i) }
function secondsOf(t){ t=(t||"").toLowerCase(); if(/^\d+$/.test(t)) return +t;
  var m=t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/); return m ? (+(m[1]||0))*3600+(+(m[2]||0))*60+(+(m[3]||0)) : 0 }
function parse(text){ text=(text||"").trim(); var id=null, t=0;
  if(/^[A-Za-z0-9_-]{11}$/.test(text)) id=text;
  else { var m=text.match(LINK); if(m) id=m[1]; var n=text.match(/[?&](?:t|start)=([0-9hms]+)/); if(n) t=secondsOf(n[1]) }
  return id ? {id:id, t:t} : null }
var q = new URLSearchParams(location.search), want = null;
if(/^[A-Za-z0-9_-]{11}$/.test(q.get("v")||"")) want = {id:q.get("v"), t:secondsOf(q.get("t"))};
else if(q.get("yt")) want = parse(q.get("yt"));
var player=null, state=-1, dur=0, over=false, speeds=[1,1.25,1.5,1.75,2], si=0;
function fmt(s){ s=Math.max(0,Math.floor(s||0)); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h?h+":"+(m<10?"0":""):"")+m+":"+(x<10?"0":"")+x }
function now(){ try{ return player.getCurrentTime()||0 }catch(e){ return 0 } }
function draw(){ var t=now(); $("fill").style.width=(dur>0?Math.min(100,100*t/dur):0)+"%";
  $("time").textContent=dur>0?fmt(t)+" / "+fmt(dur):""; $("pp").textContent=(state==1)?"❚❚":"▶" }
function show(){ $("end").className=over?"on":""; draw() }
function toggle(){ if(!player) return; if(over){ over=false; try{ player.seekTo(0,true) }catch(e){} }
  try{ if(state==1) player.pauseVideo(); else player.playVideo() }catch(e){} show() }
function full(){ if(document.fullscreenElement) document.exitFullscreen(); else $("stage").requestFullscreen() }
function move(by){ try{ player.seekTo(Math.min(Math.max(0,now()+by),dur),true) }catch(e){} setTimeout(draw,300) }
function onYouTubeIframeAPIReady(){
  player=new YT.Player("player",{events:{
    onReady:function(){ setInterval(function(){ try{ dur=player.getDuration()||0 }catch(e){} draw() },200) },
    onStateChange:function(e){ state=e.data; if(state==1) over=false; if(state==0){ over=true; try{ player.stopVideo() }catch(x){} } show() },
    onError:function(e){ var c=e.data; $("note").textContent = (c==101||c==150) ? "This video's owner doesn't let it play outside YouTube."
      : (c==100) ? "This video doesn't exist, or it's private." : (c==2) ? "That isn't a video's link." : "This video can't be played here (error "+c+")." } }}) }
if(want){
  history.replaceState(null, "", "/yt/"+want.id+(want.t?"?t="+want.t:""));   // the short address: /yt/<id>
  $("video").hidden=false; $("head").hidden=true;
  $("player").src="https://www.youtube-nocookie.com/embed/"+want.id+"?enablejsapi=1&origin="+encodeURIComponent(location.origin)
    +"&rel=0&fs=0&playsinline=1&iv_load_policy=3&controls=0&disablekb=1"+(want.t?"&start="+want.t:"");
  $("hit").addEventListener("click",toggle); $("end").addEventListener("click",toggle); $("pp").addEventListener("click",toggle);
  $("seek").addEventListener("click",function(ev){ if(!player) return; var r=$("seek").getBoundingClientRect();
    over=false; try{ player.seekTo(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))*dur,true) }catch(e){} show(); setTimeout(draw,300) });
  $("spd").addEventListener("click",function(){ si=(si+1)%speeds.length; try{ player.setPlaybackRate(speeds[si]) }catch(e){} $("spd").textContent=speeds[si]+"×" });
  $("snd").addEventListener("click",function(){ try{ if(player.isMuted()){ player.unMute(); $("snd").textContent="Sound on" } else { player.mute(); $("snd").textContent="Muted" } }catch(e){} });
  $("cp").addEventListener("click",function(){ var t=Math.floor(now()), url="https://youtu.be/"+want.id+(t>5?"?t="+t:"");
    function done(){ $("cp").textContent="Copied"; setTimeout(function(){ $("cp").textContent="Copy link" },1500) }
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, function(){ prompt("The link:", url) }); else prompt("The link:", url) });
  $("fs").addEventListener("click",full);
  document.addEventListener("keydown",function(ev){ if(!player||ev.target.tagName=="INPUT"||ev.metaKey||ev.ctrlKey||ev.altKey) return;
    if(ev.key==" "||ev.key=="k"){ ev.preventDefault(); toggle() }
    else if(ev.key=="ArrowLeft"||ev.key=="ArrowRight"){ ev.preventDefault(); move(ev.key=="ArrowLeft"?-5:5) }
    else if(ev.key=="f") full(); else if(ev.key=="m") $("snd").click() });
  var s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
}
$("f").addEventListener("submit",function(ev){ ev.preventDefault(); var w=parse($("link").value);
  if(w) location.href="/yt/?v="+w.id+(w.t?"&t="+w.t:""); else $("note").textContent="That isn't a video's link." });
</script>
</body>
</html>
